<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; media-src 'self' blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://api.openai.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="assets/cards/prototype.png" type="image/png">
<title>Arcana</title>
<style>
:root{
  --paper:#f4efe4;--paper-deep:#e8decb;--ivory:#fffaf0;--ink:#24231f;--muted:#686054;
  --line:#c8bca5;--blue:#36586e;--blue-soft:#dce8eb;--gold:#9c782d;--gold-soft:#ead9a8;
  --oxide:#56766d;--danger:#8a3d34;--night:#26313a;--shadow:0 18px 52px rgba(43,35,24,.15);
  --serif:Georgia,Cambria,"Times New Roman",serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth;overflow-anchor:none}
body{margin:0;min-width:320px;color:var(--ink);font:16px/1.55 var(--sans);background:
  radial-gradient(circle at 15% 0,rgba(255,255,255,.8),transparent 30rem),
  linear-gradient(110deg,rgba(96,75,42,.025) 1px,transparent 1px),
  linear-gradient(20deg,rgba(76,67,50,.018) 1px,transparent 1px),var(--paper);
  background-size:auto,13px 13px,17px 17px}
button,input,textarea{font:inherit;color:inherit}
button,input,textarea{min-height:44px}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.home{max-width:1180px;margin:auto;padding:clamp(26px,6vw,78px) clamp(18px,4vw,48px) 52px}
.masthead{max-width:820px;margin:2vh 0 34px}
.eyebrow,.optional-label{text-transform:uppercase;letter-spacing:.15em;color:var(--oxide);font-size:.72rem;font-weight:800}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.1;margin:.1em 0 .48em}
h1{font-size:clamp(3.5rem,10vw,7rem);font-weight:500;letter-spacing:-.055em}
h2{font-size:clamp(1.65rem,4vw,2.6rem);font-weight:500}
h3{font-size:1.3rem}
.subtitle{font:clamp(1.15rem,2.5vw,1.55rem)/1.35 var(--serif);color:var(--blue);max-width:660px}
.boundary{max-width:830px;border-left:2px solid var(--gold);padding:.7rem 0 .7rem 1rem;color:#4c463d}
.quiet{color:var(--muted);font-size:.92rem}
.setup-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:26px;align-items:start}
.panel{padding:clamp(19px,3vw,31px);border:1px solid var(--line);background:rgba(255,250,240,.7)}
.ritual-panel{background:rgba(255,250,240,.9);border-color:#b9aa8f;box-shadow:0 16px 44px rgba(57,44,25,.1)}
.optional-panel{background:rgba(225,233,230,.42);border-color:#b9c6c2}
.field{display:grid;gap:6px;margin:0 0 17px}
.field label,.field-label{font-weight:750;font-size:.91rem}
.field textarea,.field input[type=password]{width:100%;padding:10px 11px;border:1px solid #aaa08d;background:#fffdf7;color:var(--ink)}
.field textarea{min-height:96px;resize:vertical}
.choice{display:flex;align-items:flex-start;gap:10px;margin:11px 0}
.choice input{width:20px;height:20px;min-height:20px;margin:3px 0 0;accent-color:var(--blue)}
.choice label{flex:1}
.formation-list{display:grid;gap:9px}
.formation-option{display:flex;gap:10px;padding:12px;border:1px solid var(--line);background:rgba(255,253,247,.67)}
.formation-option input{width:20px;height:20px;min-height:20px;margin:2px 0 0;accent-color:var(--blue)}
.formation-option strong{display:block}
.formation-option small{display:block;color:var(--muted);margin-top:2px}
.primary{border:0;background:var(--blue);color:white;font-weight:800;padding:12px 20px;box-shadow:0 4px 0 #253d4c}
.primary:hover{background:#294b63}
.secondary{border:1px solid #8b806d;background:transparent;padding:9px 13px}
.secondary:hover{background:var(--paper-deep)}
.danger{color:#6d261f;border-color:#9d5c50}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.home-utilities{margin-top:18px}
.status{margin:12px 0 0;padding:9px 11px;border-left:3px solid var(--oxide);background:rgba(216,229,233,.5);color:#26404b}
.status.error{border-color:var(--danger);background:#f4e2dc}
.optional-settings{margin-top:16px;border-top:1px solid rgba(87,118,110,.36);padding-top:13px}
.optional-settings summary{font-weight:800;color:var(--blue);cursor:pointer;padding:6px 0}
.ai-controls{padding-top:11px}
.small-card{font-size:.88rem;color:var(--muted);padding:9px 11px;background:rgba(216,229,233,.42);border-left:2px solid var(--blue)}
.depth-control{display:grid;gap:7px;margin:18px 0}
.depth-head,.depth-scale{display:flex;justify-content:space-between;gap:10px}
.depth-head output{font:1.05rem var(--serif);color:var(--blue)}
.depth-control input{width:100%;accent-color:var(--blue)}

footer{max-width:1180px;margin:auto;padding:15px max(18px,calc(env(safe-area-inset-left) + 18px));border-top:1px solid var(--line);color:var(--muted);font-size:.77rem}
.reading-nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) max(12px,calc(env(safe-area-inset-right) + 12px)) 8px max(12px,calc(env(safe-area-inset-left) + 12px));border-bottom:1px solid var(--line);background:rgba(244,239,228,.96);backdrop-filter:blur(9px)}
.nav-title{font:1.25rem var(--serif);white-space:nowrap}
.nav-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

.nav-actions button:hover{border-color:var(--line);background:var(--ivory)}
.media-transport{min-width:0;display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:4px 9px;align-items:center;padding:5px 8px;border:1px solid var(--line);background:rgba(255,250,240,.84);transition:opacity .18s}
.media-transport.empty{visibility:hidden;pointer-events:none;opacity:0}
.media-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue);font-size:.76rem;font-weight:800}
.media-controls{display:flex;gap:2px}
.media-controls button{min-height:30px;padding:2px 6px;border:1px solid transparent;background:transparent;font-size:.73rem}
.media-progress{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:7px}
.media-progress progress{width:100%;height:7px;accent-color:var(--oxide)}
.media-time{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.reading-main{max-width:1440px;margin:auto;padding:clamp(16px,3vw,36px) max(14px,calc(env(safe-area-inset-right) + 14px)) 54px max(14px,calc(env(safe-area-inset-left) + 14px))}
.reading-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
.reading-intro h1{font-size:clamp(1.9rem,4vw,3.1rem);margin:0}
.reading-intro p{max-width:520px;margin:0;color:var(--muted)}
.formation{display:grid;grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));gap:clamp(12px,2vw,26px);align-items:start;min-height:45vh}
.position{display:grid;align-content:start;gap:9px;width:100%;max-width:430px;min-width:0;justify-self:center}
.position-label{min-height:43px;padding-left:4px;color:var(--blue);font:1.08rem/1.2 var(--serif)}
.position-label span{display:block;margin-top:4px;color:var(--muted);font:400 .77rem/1.35 var(--sans)}
.card-button{position:relative;display:block;width:100%;min-height:0;padding:0;border:0;background:none;text-align:inherit;perspective:1300px}
.card-button:focus-visible{outline:none}
.card-button:focus-visible .card-shell{outline:3px solid var(--blue);outline-offset:4px}
.card-button.selected .card-shell{box-shadow:0 0 0 3px var(--gold),0 14px 30px rgba(39,32,23,.25)}
.card-button.text-pending .card-shell{animation:text-glow 2.15s ease-in-out infinite}
.card-button.voice-pending .card-shell{animation:voice-glow 2.35s ease-in-out infinite}
.card-button.ai-ready .card-shell{box-shadow:0 0 0 2px var(--gold),0 0 0 4px rgba(87,118,110,.65)}
.card-button.turning{pointer-events:none}
.card-button.turning .card-shell{animation:card-turn .78s cubic-bezier(.2,.72,.18,1) both}
.card-button:hover .card-shell{transform:translateY(-2px)}
.card-button.revealed:hover .card-shell{transform:translateY(-2px) rotateY(180deg)}
.card-shell{position:relative;display:block;width:100%;aspect-ratio:2/3;border-radius:3px;background:var(--night);box-shadow:0 8px 19px rgba(39,33,24,.2);transform-style:preserve-3d;transition:transform .22s,box-shadow .22s,filter .22s}
.card-shell::after{content:"";position:absolute;inset:0;z-index:3;border-radius:3px;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 35%,rgba(255,251,237,.72) 49%,transparent 63%);transform:translateX(-80%)}
.turning .card-shell::after{animation:edge-sweep .78s ease-out}
.revealed .card-shell{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;overflow:hidden;border-radius:3px;background:var(--night);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-front{transform:rotateY(180deg)}
.card-face img{display:block;width:100%;height:100%;object-fit:cover}
.card-front img.reversed-art{transform:rotate(180deg)}
.orientation{min-height:20px;color:var(--muted);font-size:.77rem}
.orientation strong{color:var(--ink)}
.reflection-trigger{justify-self:start;min-height:38px;padding:7px 10px;font-size:.83rem}
.completion{max-width:980px;margin:38px auto 0;padding:clamp(20px,3vw,32px);border-top:4px double var(--gold);background:rgba(255,250,240,.6)}
.completion textarea{width:100%;min-height:116px;padding:11px;border:1px solid var(--line);background:var(--ivory);resize:vertical}
.final-view{margin:18px 0;padding:18px;border:1px solid var(--gold);background:var(--ivory)}
.final-view p{white-space:pre-wrap}
.complete-focus .formation{--columns:5}
.complete-focus .position{max-width:var(--focus-width,140px);gap:5px;transition:max-width .18s linear}
.complete-focus .orientation,.complete-focus .reflection-trigger{display:none}
.final-pending .card-shell{animation:text-glow 2.3s ease-in-out infinite}
.backdrop,.reflection-backdrop,.entry-backdrop{position:fixed;inset:0;background:rgba(35,40,39,.56);backdrop-filter:blur(3px)}
.backdrop{z-index:39}.reflection-backdrop{z-index:40}.entry-backdrop{z-index:50}
.drawer{position:fixed;z-index:40;top:0;right:0;width:min(610px,94vw);height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--paper);box-shadow:-12px 0 42px rgba(34,28,21,.28)}
.drawer-head,.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.drawer-head{padding:calc(15px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line);background:var(--ivory)}
.drawer-head h2,.dialog-head h2{margin:0}
.drawer-body{overflow:auto;overscroll-behavior:contain;padding:22px 20px calc(26px + env(safe-area-inset-bottom))}
.drawer-switch{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.reflection-pane{position:fixed;z-index:41;top:50%;width:min(640px,calc(58vw - 32px));height:min(780px,calc(100dvh - 28px));transform:translateY(-50%);display:grid;grid-template-rows:auto auto minmax(0,1fr);padding:22px;border:1px solid var(--gold);background:var(--ivory);box-shadow:0 22px 64px rgba(36,29,21,.28)}
.reflection-pane.left{left:18px}.reflection-pane.right{right:18px}
.reflection-body{overflow:auto;overscroll-behavior:contain;padding-right:7px}
.reflection-section{padding:16px 0;border-top:1px solid var(--line)}
.reflection-section:first-child{border-top:0}
.reflection-grid{display:grid;grid-template-columns:minmax(115px,.35fr) 1fr;gap:8px 16px}
.reflection-grid dt{font-weight:800;color:var(--blue)}
.reflection-grid dd{margin:0 0 10px}
.position.inspection-selected{position:relative;z-index:42}
.entry-dialog{position:fixed;z-index:51;top:50%;left:50%;width:min(560px,calc(100vw - 28px));transform:translate(-50%,-50%);padding:clamp(22px,4vw,34px);border:1px solid var(--gold);background:var(--ivory);box-shadow:0 26px 72px rgba(34,28,21,.31)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.gallery-item{margin:0}.gallery-item img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--line)}.gallery-item figcaption{margin-top:5px;color:var(--muted);font-size:.74rem}
.history-item{padding:13px 0;border-bottom:1px solid var(--line)}
@keyframes card-turn{0%{transform:rotateY(0) translateY(0);filter:brightness(1)}12%{transform:rotateY(0) translateY(2px) scale(.994)}35%{transform:rotateY(66deg) translateY(-8px);filter:brightness(1.05);box-shadow:0 20px 35px rgba(39,33,24,.28)}72%{transform:rotateY(180deg) translateY(-5px);filter:brightness(1.07)}100%{transform:rotateY(180deg) translateY(0);filter:brightness(1)}}
@keyframes edge-sweep{0%,28%{opacity:0;transform:translateX(-80%)}48%{opacity:.8}72%{opacity:0;transform:translateX(80%)}100%{opacity:0}}
@keyframes text-glow{0%,100%{box-shadow:0 0 0 2px var(--ivory),0 0 0 5px var(--blue),0 0 14px 4px rgba(54,86,109,.32)}50%{box-shadow:0 0 0 2px var(--ivory),0 0 0 5px var(--oxide),0 0 25px 9px rgba(155,120,45,.48)}}
@keyframes voice-glow{0%,100%{box-shadow:0 0 0 2px var(--ivory),0 0 0 5px #b38835,0 0 15px 5px rgba(179,136,53,.34)}50%{box-shadow:0 0 0 2px var(--ivory),0 0 0 5px var(--gold),0 0 26px 10px rgba(155,120,45,.58)}}
@media(max-width:900px){.reading-nav{grid-template-columns:auto 1fr}.media-transport{grid-column:1/-1;grid-row:2}.nav-actions{grid-column:2}.setup-grid{grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr)}}
@media(max-width:720px){
  .setup-grid{grid-template-columns:1fr}.reading-intro{display:block}.reading-intro p{margin-top:8px}
  .formation{grid-template-columns:1fr!important;gap:22px}.position{max-width:min(100%,430px)}.position-label{min-height:auto}
  .drawer{width:100vw}.complete-focus .formation{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .nav-title{font-size:1.02rem}.nav-actions{gap:0}.nav-actions button{padding:6px 5px;font-size:.74rem}
  .card-button:hover .card-shell{transform:none}.card-button.revealed:hover .card-shell{transform:rotateY(180deg)}
  .reflection-pane{left:14px!important;right:14px!important;top:auto;bottom:14px;width:auto;height:min(49dvh,440px);transform:none;padding:17px}
  .position.inspection-selected{position:fixed;top:calc(158px + env(safe-area-inset-top));left:50%;width:min(30vw,130px);margin:0;transform:translateX(-50%)}
  .position.inspection-selected .position-label,.position.inspection-selected .orientation,.position.inspection-selected .reflection-trigger{display:none}
  .reflection-grid{grid-template-columns:1fr;gap:2px}.reflection-grid dd{margin-bottom:12px}
}
@media(max-width:390px){.reading-nav{gap:4px}.nav-title{font-size:.9rem}.nav-actions button{padding:5px 3px;font-size:.65rem}.media-transport{grid-template-columns:1fr}.media-controls{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}.revealed .card-shell,.card-button.revealed:hover .card-shell{transform:rotateY(180deg)}.card-button.text-pending .card-shell,.card-button.voice-pending .card-shell{outline:4px solid var(--blue);outline-offset:3px}}
@media(forced-colors:active){.panel,.card-shell,.drawer,.reflection-pane,.entry-dialog{border:1px solid CanvasText}.card-button.selected .card-shell,.card-button.text-pending .card-shell,.card-button.voice-pending .card-shell{outline:3px solid Highlight}}
</style>

<body>
<div id="app"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script src="deck-data.js"></script>
<script>
(() => {
"use strict";

const appRoot=document.getElementById("app");
const liveRegion=document.getElementById("live");
const isPlain=value=>value!==null&&typeof value==="object"&&!Array.isArray(value)&&(Object.getPrototypeOf(value)===Object.prototype||Object.getPrototypeOf(value)===null);
const make=(tag,properties,...children)=>{
  const node=document.createElement(tag);
  for(const [key,value] of Object.entries(properties||{})){
    if(key==="class")node.className=value;
    else if(key==="text")node.textContent=value;
    else if(key==="on")for(const [event,handler] of Object.entries(value))node.addEventListener(event,handler);
    else if(key==="attrs")for(const [name,attribute] of Object.entries(value))node.setAttribute(name,attribute);
    else if(key in node)node[key]=value;
    else node.setAttribute(key,value);
  }
  for(const child of children.flat())if(child!==null&&child!==undefined)node.append(child.nodeType?child:document.createTextNode(String(child)));
  return node;
};
const requiredString=(value,name)=>{if(typeof value!=="string"||!value.trim()||value.length>10000)throw Error("Invalid "+name+".");return value.trim()};
const requiredInteger=(value,name)=>{if(!Number.isSafeInteger(value)||value<0)throw Error("Invalid "+name+".");return value};
const requiredArray=(value,name)=>{if(!Array.isArray(value)||!value.length)throw Error("Invalid "+name+".");return value};
const assetPath=value=>typeof value==="string"&&value.length<500&&/^[\x21-\x7e]+$/.test(value)&&/\.png$/i.test(value)&&!/[\\?#]/.test(value)&&!value.startsWith("/")&&!value.includes("://")&&!value.split("/").some(part=>part==="."||part===".."||!part);
const announce=text=>{liveRegion.textContent="";requestAnimationFrame(()=>{liveRegion.textContent=text})};
const formatTime=seconds=>{if(!Number.isFinite(seconds)||seconds<0)return "—:—";const total=Math.floor(seconds);return Math.floor(total/60)+":"+String(total%60).padStart(2,"0")};
const wordCount=value=>typeof value==="string"?(value.trim().match(/\S+/g)||[]).length:0;

class DeckRepository{
  load(raw){
    if(!isPlain(raw))throw Error("Deck data is unavailable.");
    const id=requiredString(raw.id,"deck id");
    const title=requiredString(raw.title,"title");
    const subtitle=requiredString(raw.subtitle,"subtitle");
    const total=requiredInteger(raw.card_count,"card count");
    if(!isPlain(raw.arcana)||!isPlain(raw.arcana.major)||!isPlain(raw.arcana.minor))throw Error("Arcana categories are invalid.");
    const majorCount=requiredInteger(raw.arcana.major.count,"Major count");
    const minorCount=requiredInteger(raw.arcana.minor.count,"Minor count");
    if(total!==55||majorCount!==15||minorCount!==40||majorCount*2>=minorCount)throw Error("Arcana requires exactly 15 Major and 40 Minor cards.");
    if(!isPlain(raw.production)||!isPlain(raw.prototype_card)||!isPlain(raw.cards))throw Error("Card production data is invalid.");
    const prototypeId=requiredString(raw.production.prototype_card_id,"prototype id"),generatedEntries=Object.entries(raw.cards);
    if(generatedEntries.length!==total-1||generatedEntries.some(([key],index)=>key!==String(index+1)))throw Error("Card artifact indices must be consecutive string keys from 1.");
    const generatedRecords=generatedEntries.map(([,record])=>record),assetById=new Map(generatedEntries.map(([key,record])=>[requiredString(record.id,"card id"),"assets/cards/card-"+key+".png"]));
    const cardRecords=[raw.prototype_card,...generatedRecords].sort((left,right)=>requiredInteger(left.number,"card number")-requiredInteger(right.number,"card number"));
    if(cardRecords.length!==total||requiredInteger(raw.production.non_prototype_count,"non-prototype count")!==total-1)throw Error("Card production counts disagree.");
    const ids=new Set();
    const cards=cardRecords.map((record,index)=>{
      if(!isPlain(record)||requiredInteger(record.number,"card number")!==index+1)throw Error("Card numbers must be consecutive.");
      const cardId=requiredString(record.id,"card id");if(ids.has(cardId))throw Error("Card ids must be unique.");ids.add(cardId);
      const category=requiredString(record.category,"category").toLowerCase();if(!["major","minor"].includes(category))throw Error("Card category is invalid.");
      const source=record.concept_source;if(!isPlain(source)||!Array.isArray(source.domains))throw Error("Concept source is invalid.");
      const motifs=requiredArray(record.motifs,"motifs").map((motif,index)=>requiredString(motif,"motif "+index));if(motifs.some(motif=>!raw.motifs[motif]))throw Error("A motif reference is unavailable.");
      const suit=category==="minor"?requiredString(record.suit,"suit"):"";
      const rank=category==="minor"?requiredString(record.rank,"rank"):"";
      if(category==="minor"&&(!raw.suits[suit]||!raw.ranks[rank]))throw Error("A Minor suit or rank is unavailable.");
      const image=cardId===prototypeId?"assets/cards/prototype.png":assetById.get(cardId);if(!assetPath(image))throw Error("A generated image path is unsafe.");
      return{
        id:cardId,number:index+1,title:requiredString(record.title,"card title"),category,suit,rank,image,
        categoryPurpose:requiredString(raw.arcana[category].purpose,"category purpose"),
        essence:requiredString(record.essence,"essence"),generative:requiredString(record.generative,"generative meaning"),
        destructive:requiredString(record.destructive,"destructive meaning"),reversed:requiredString(record.reversed,"reversed meaning"),
        emotional:requiredString(record.emotional_register,"emotional register"),question:requiredString(record.question,"question"),
        lineage:requiredString(record.lineage,"lineage"),motifs,alt:requiredString(record.accessible_visual_description,"visual description"),
        concept:source.domains.map(domain=>requiredString(domain,"concept domain")).join(", ")+" — "+requiredString(source.concept,"concept")+": "+requiredString(source.factual_anchor,"factual anchor")+" Boundary: "+requiredString(source.epistemic_boundary,"epistemic boundary"),
        bridge:requiredString(source.reflective_bridge,"reflective bridge")
      };
    });

    if(cards.filter(card=>card.category==="major").length!==majorCount||cards.filter(card=>card.category==="minor").length!==minorCount)throw Error("Card category counts disagree.");
