<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Orion and the Hunt for His Spark</title>
  <style>
    @page {
      size: 1536px 1024px;
      margin: 0;
    }

    html,
    body {
      width: 1536px;
      height: 1024px;
      margin: 0;
      padding: 0;
      background: #f6c979;
    }

    body {
      overflow: hidden;
    }

    .page {
      width: 1536px;
      height: 1024px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      break-after: page;
      page-break-after: always;
      break-inside: avoid;
      page-break-inside: avoid;
      box-sizing: border-box;
    }

    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    .cover {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6c979;
      color: #4d2d4d;
      text-align: center;
    }

    .cover h1 {
      max-width: 1180px;
      margin: 0;
      padding: 80px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 112px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.01em;
      box-sizing: border-box;
    }

    .page img {
      display: block;
      width: 1536px;
      height: 1024px;
      margin: 0;
      padding: 0;
      border: 0;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <section class="page cover" aria-label="Cover page">
    <h1>Orion and the Hunt for His Spark</h1>
  </section>
  <section class="page"><img src="pages/page-1.png" alt=""></section>
  <section class="page"><img src="pages/page-2.png" alt=""></section>
  <section class="page"><img src="pages/page-3.png" alt=""></section>
  <section class="page"><img src="pages/page-4.png" alt=""></section>
  <section class="page"><img src="pages/page-5.png" alt=""></section>
  <section class="page"><img src="pages/page-6.png" alt=""></section>
  <section class="page"><img src="pages/page-7.png" alt=""></section>
  <section class="page"><img src="pages/page-8.png" alt=""></section>
  <section class="page"><img src="pages/page-9.png" alt=""></section>
  <section class="page"><img src="pages/page-10.png" alt=""></section>
  <section class="page"><img src="pages/page-11.png" alt=""></section>
  <section class="page"><img src="pages/page-12.png" alt=""></section>
</body>
</html>
